<!-- The language toggle: the EN | ES buttons in the header switch the page and remember the choice in this
     browser. The kit's docs-close.html builds the breadcrumbs and "On this page" from text, which would join both
     languages; they are rebuilt here from the marked-up headings and navigation, so each shows one language. -->
<script>
(function () {
  var root = document.documentElement;
  function set(l) {
    root.lang = l;
    try { localStorage.setItem('thermomat-lang', l); } catch (e) {}
    document.querySelectorAll('[data-set-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-set-lang') === l ? 'true' : 'false');
    });
  }
  document.querySelectorAll('[data-set-lang]').forEach(function (b) {
    b.addEventListener('click', function () { set(b.getAttribute('data-set-lang')); });
  });
  set(root.lang === 'es' ? 'es' : 'en');

  /* "On this page": copy each heading's markup, both languages, instead of its joined text. */
  document.querySelectorAll('.docs-toc ol a[href^="#"]').forEach(function (a) {
    var h = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    if (h && h.querySelector('[data-lang]')) {
      var c = h.cloneNode(true);
      c.querySelectorAll('.anchorjs-link').forEach(function (n) { n.remove(); });
      a.innerHTML = c.innerHTML.trim();
    }
  });
  var t = document.querySelector('.docs-toc .t');
  if (t) t.innerHTML = '<span data-lang="en" lang="en">On this page</span><span data-lang="es" lang="es">En esta página</span>';

  /* Breadcrumbs: group › page, from the navigation's markup. */
  var crumbs = document.querySelector('.docs-crumbs'), cur = document.querySelector('.docs-nav a.current');
  if (crumbs && cur && cur.querySelector('[data-lang]')) {
    var det = cur.closest('details.group'), g = det && det.querySelector('summary.t');
    var parts = [];
    if (g && g.textContent.trim() !== cur.textContent.trim()) parts.push(g.innerHTML);
    parts.push(cur.innerHTML);
    crumbs.innerHTML = parts.map(function (p, i) {
      return (i ? '<span class="sep">›</span>' : '') + '<span>' + p + '</span>';
    }).join('');
  }
})();
</script>
